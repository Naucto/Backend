networks:
  naucto-dev:
    name: naucto-dev
    driver: bridge

services:
  db:
    networks:
      - naucto-dev

  # S3-compatible object storage the browser can reach, so a published release plays on localhost.
  # MinIO no longer publishes images; pgsty/* rebuilds the upstream releases unchanged.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-naucto}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-naucto-dev-secret}
    ports:
      # 9000 must be published: the *browser* fetches release content straight from EDGE_ENDPOINT.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - naucto-dev

  # Creates the bucket and makes it anonymously readable, because EDGE_ENDPOINT hands the browser
  # an unsigned URL. Runs once and exits.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set dev http://minio:9000 ${S3_ACCESS_KEY_ID:-naucto} ${S3_SECRET_ACCESS_KEY:-naucto-dev-secret} &&
      mc mb --ignore-existing dev/${S3_BUCKET_NAME:-naucto-dev} &&
      mc anonymous set download dev/${S3_BUCKET_NAME:-naucto-dev} &&
      echo 'minio ready: bucket ${S3_BUCKET_NAME:-naucto-dev} is public-read'
      "
    restart: "no"
    networks:
      - naucto-dev

  backend:
    build:
      target: dev
    # The dev image bundles the Prisma CLI and self-migrates on start (see the
    # dev stage CMD), so the prod-only `migrate` service is not needed here.
    depends_on: !override
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - naucto-dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src

        # Ahead of the plain sync below, so an edit here rebuilds (re-running `prisma generate`)
        # instead of syncing a client-less change into the container.
        - action: rebuild
          path: prisma/models

        - action: sync
          path: ./prisma
          target: /app/prisma
          ignore:
            - migrations

        - action: rebuild
          path: package.json

        - action: rebuild
          path: prisma/schema.prisma

volumes:
  minio-data:
