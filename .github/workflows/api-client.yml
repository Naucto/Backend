name: API client
on:
  push:
    branches: [main]
    tags: ['api-client/v*']
  pull_request:
permissions:
  contents: read
  packages: write
  pull-requests: write
concurrency: { group: 'api-client-${{ github.ref }}', cancel-in-progress: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@naucto'
      - run: npm ci
      - name: Generate and build @naucto/api-client from the committed swagger.json
        run: npm run client:build
      - name: Resolve version and dist-tag
        id: meta
        shell: bash
        run: |
          base=$(node -p "require('./client/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/api-client/v* ]]; then
            tagged="${GITHUB_REF#refs/tags/api-client/v}"
            if [[ "$tagged" != "$base" ]]; then
              echo "Tag version $tagged does not match client/package.json version $base" >&2
              exit 1
            fi
            echo "version=$base" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            pr="${{ github.event.pull_request.number }}"
            echo "version=$base-pr.$pr.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "tag=pr-$pr" >> "$GITHUB_OUTPUT"
          else
            echo "version=$base-main.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "tag=next" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        working-directory: client
        run: |
          npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version
          npm publish --tag "${{ steps.meta.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment install line on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- api-client-install -->';
            const body = `${marker}\n📦 \`@naucto/api-client\` built from this PR:\n\n\`\`\`sh\nnpm install @naucto/api-client@${{ steps.meta.outputs.tag }}   # ${{ steps.meta.outputs.version }}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
