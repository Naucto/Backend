networks:
  naucto:
    name: naucto
    driver: bridge

# POSTGRES_HOST/DATABASE_URL in .env address the database from the host; on this
# network it is always `db`. Set DOCKER_DATABASE_URL to point at an external one.
x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}

services:
  db:
    # Pinned: a major bump makes the existing db-data volume unreadable.
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - naucto

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *db-env
    restart: "no"
    networks:
      - naucto

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      <<: *db-env
      PORT: "3000"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
      - "4096:4096"
      - "4097:4097"
      - "4098:4098"
    restart: unless-stopped
    networks:
      - naucto

volumes:
  db-data:
