networks:
  naucto:
    name: naucto
    driver: bridge

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile
  args:
    - BACKEND_PORT=${BACKEND_PORT}

services:
  db:
    # Match the major running on production theta: the image decides the data layout of
    # db-data, and a major bump across an existing volume needs its own migration.
    image: postgres:18
    restart: always
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - naucto

  migrate:
    build:
      <<: *backend-build
      target: migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment: &database-url
      # The database by its service name on this network; a DATABASE_URL in .env still wins.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
    restart: "no"
    networks:
      - naucto

  backend:
    build:
      <<: *backend-build
      target: prod
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment: *database-url
    ports:
      - "${BACKEND_PORT}:3000"
      # Identity-mapped: without BACKEND_WEBRTC_PUBLIC_URL_TEMPLATE the backend advertises the port
      # it bound, so the host port must be the same one.
      - "${BACKEND_WEBRTC_PORT_BASE:-10000}-${BACKEND_WEBRTC_PORT_END:-10009}:${BACKEND_WEBRTC_PORT_BASE:-10000}-${BACKEND_WEBRTC_PORT_END:-10009}"
    restart: on-failure
    networks:
      - naucto

volumes:
  db-data:

